<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: linear-gradient(135deg, #ffe0ec, #ffc1d5, #fff0f5);
  font-family: Georgia, serif;
}

.card {
  text-align: center;
  padding: 40px 25px;
  width: 90%;
  max-width: 420px;
  background: rgba(255,255,255,0.7);
  border-radius: 25px;
  box-shadow: 0 10px 40px #d66b8c44;
  animation: appear 1.5s ease;
  z-index: 2;
}

h1 {
  color: #e34d7b;
  font-size: 32px;
  margin-bottom: 20px;
}

.heart {
  font-size: 65px;
  animation: beat 1s infinite;
  margin-bottom: 20px;
}

p {
  color: #9c4563;
  font-size: 19px;
  line-height: 1.7;
}

button {
  margin-top: 25px;
  border: none;
  background: #e75c89;
  color: white;
  padding: 13px 25px;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
}

#secret {
  display: none;
  margin-top: 20px;
  color: #d83f73;
  font-size: 20px;
}

.floating {
  position: absolute;
  bottom: -30px;
  animation: float 7s linear infinite;
  opacity: 0.7;
}

@keyframes beat {
  50% { transform: scale(1.2); }
}

@keyframes float {
  to { transform: translateY(-110vh) rotate(360deg); }
}

@keyframes appear {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="card">
  <div class="heart">❤️</div>
  <h1>Happy One Month!</h1>

  <p>
    Two years of knowing you...<br>
    One month of being yours.
  </p>

  <button onclick="reveal()">Open my heart 💗</button>

  <div id="secret">
    I LOVEEE YOUUU WITH EVERYTHINGGG ❤️
    <br><br>
    You're my favorite person,
    my happiness, and my
    favorite part of every day.
    <br><br>
    Here's to us. Always. ♡
  </div>
</div>

<script>
function reveal() {
  document.getElementById("secret").style.display = "block";
}

for(let i = 0; i < 30; i++) {
  let heart = document.createElement("div");
  heart.className = "floating";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDelay = Math.random() * 7 + "s";
  heart.style.fontSize = (15 + Math.random() * 20) + "px";
  document.body.appendChild(heart);
}
</script>

</body>
</html>
